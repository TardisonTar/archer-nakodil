name: Import Svistok projects

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-svistok.yml'

permissions:
  contents: write

jobs:
  import-svistok:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import verified Svistok projects
        run: python .bootstrap/import_svistok.py
      - name: Commit Svistok sources
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A svistok
          git commit -m "import: load Svistok CREC 0.1.3.9 and Dom 0.0.9.0"
          git push
