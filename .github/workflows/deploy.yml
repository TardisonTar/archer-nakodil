name: Deploy Archer Nakodil
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: archer-nakodil-production
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate JavaScript
        run: |
          find assets games -name '*.js' -print0 | xargs -0 -r -n1 node --check
      - name: Validate JSON
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          for p in Path('.').rglob('*.json'):
              json.loads(p.read_text(encoding='utf-8'))
              print('OK',p)
          PY
      - name: Check internal links
        run: python scripts/check-site.py
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.ARCHER_SSH_KEY }}
          SSH_HOST: ${{ secrets.ARCHER_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Deploy files
        env:
          SSH_HOST: ${{ secrets.ARCHER_HOST }}
          SSH_USER: ${{ secrets.ARCHER_USER }}
          WEBROOT: ${{ secrets.ARCHER_WEBROOT }}
        run: |
          rsync -az --checksum \
            --exclude '.git/' --exclude '.github/' --exclude 'release-out/' \
            ./ "$SSH_USER@$SSH_HOST:$WEBROOT/"
      - name: Reload nginx safely
        env:
          SSH_HOST: ${{ secrets.ARCHER_HOST }}
          SSH_USER: ${{ secrets.ARCHER_USER }}
        run: ssh "$SSH_USER@$SSH_HOST" 'sudo nginx -t && sudo systemctl reload nginx'
