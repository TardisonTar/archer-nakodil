<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101110"><title>Статус — Archer Nakodil</title><link rel="icon" href="../assets/icons/favicon.svg"><link rel="stylesheet" href="../assets/css/tokens.css"><link rel="stylesheet" href="../assets/css/layout.css"><link rel="stylesheet" href="../assets/css/components.css"><link rel="stylesheet" href="../assets/css/pages.css"><link rel="stylesheet" href="../assets/css/brand.css"><link rel="manifest" href="/manifest.webmanifest"></head><body data-brand="archer"><div class="wrap"><header class="site-header"><a href="../index.html" class="brand"><span class="brand-icon">A</span><span class="brand-copy">ARCHER<br>NAKODIL</span></a><nav class="site-nav"><a href="../index.html">Главная</a><a href="../launcher/">Лаунчер</a><a href="../updates/index.html">Обновления</a></nav></header></div><main><div class="wrap"><section class="page-hero"><div class="mono">Status / Monitoring</div><h1>Статус_</h1><p>Состояние API и обезличенная агрегированная статистика портала.</p></section><section class="section"><div class="grid-3" id="health-cards"><div class="panel"><div class="mono muted">API</div><h2 id="api-status">Проверяем…</h2></div><div class="panel"><div class="mono muted">Uptime</div><h2 id="uptime">—</h2></div><div class="panel"><div class="mono muted">Свободно</div><h2 id="disk">—</h2></div></div><div class="panel panel-spaced"><div class="mono muted">Последние 30 дней</div><div id="summary" class="metrics-summary">Загрузка…</div></div></section></div></main><script>const API='https://api.archer-nakodil.ru';const fmt=n=>new Intl.NumberFormat('ru-RU').format(n||0);fetch(API+'/health',{cache:'no-store'}).then(r=>r.json()).then(x=>{document.querySelector('#api-status').textContent=x.ok?'Работает':'Ошибка';document.querySelector('#api-status').className=x.ok?'acid':'';document.querySelector('#uptime').textContent=Math.floor(x.uptimeSeconds/3600)+' ч';document.querySelector('#disk').textContent=(x.diskFreeBytes/1073741824).toFixed(1)+' ГБ'}).catch(()=>document.querySelector('#api-status').textContent='Недоступен');fetch(API+'/v1/summary?days=30',{cache:'no-store'}).then(r=>r.json()).then(x=>{const t=x.totals||{};document.querySelector('#summary').innerHTML='<div class="stat-strip"><div class="stat"><strong>'+fmt(t.page_view)+'</strong><span>просмотров страниц</span></div><div class="stat"><strong>'+fmt(t.project_open)+'</strong><span>запусков проектов</span></div><div class="stat"><strong>'+fmt(t.download)+'</strong><span>скачиваний</span></div></div>'}).catch(()=>document.querySelector('#summary').textContent='Статистика пока недоступна.');</script><script defer src="/assets/js/pwa.js"></script></body></html>
